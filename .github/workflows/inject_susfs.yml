name: Inject SusFS v2.1.0 into Ocin4everKernel

on:
  push: 
  workflow_dispatch:
    inputs:
      ksu_tag:
        description: "KernelSU-Next tag"
        default: "v3.1.0-legacy-susfs"
        required: false
      dry_run:
        description: "Dry run (show changes, no push)"
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  KERNEL_REPO: "kingdom12-36/Ocin4everKernel"
  KERNEL_BRANCH: "Susfs"

jobs:
  inject:
    name: "Inject SusFS v2.1.0"
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Clone Target Kernel Repository
        run: |
          git config --global user.name  "SusFS Bot"
          git config --global user.email "susfs-bot@noreply"
          git clone \
            --recurse-submodules \
            --branch "${{ env.KERNEL_BRANCH }}" \
            "https://${{ secrets.GH_PAT }}@github.com/${{ env.KERNEL_REPO }}.git" \
            kernel

      - name: Fetch SusFS v2.1.0 directly from Commit
        run: |
          # سحب المستودع بدون عمل checkout للملفات أولاً لتوفير الوقت والبيانات
          git clone --no-checkout https://github.com/raystef66/kernel_xiaomi_cepheus.git susfs_source
          cd susfs_source
          
          # الانتقال المباشر للكوميت المطلوب
          git checkout 1f377f287413c63fa54e580459db4b868212ddbc || git checkout 118f46f
          cd ..

          # تجهيز مجلد susfs4ksu ليطابق المسارات المتوقعة
          mkdir -p susfs4ksu/kernel_patches/fs susfs4ksu/kernel_patches/include/linux

          # نسخ ملفات SusFS v2.1.0 الأساسية من الكوميت
          cp susfs_source/fs/susfs.c susfs4ksu/kernel_patches/fs/
          cp susfs_source/include/linux/susfs*.h susfs4ksu/kernel_patches/include/linux/

          # البحث عن ملف الباتش لفرع 4.14 ونسخه
          find susfs_source/ -name "*4.14*.patch" -exec cp {} susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.14.patch \; || true

      - name: Run Inject Script
        env:
          KSU_TAG: ${{ github.event.inputs.ksu_tag }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          chmod +x inject_susfs_v2.sh
          ./inject_susfs_v2.sh \
            "$(pwd)/kernel" \
            "$(pwd)/susfs4ksu" \
            "${{ env.KERNEL_REPO }}" \
            "${{ env.KERNEL_BRANCH }}" \
            "${{ github.event.inputs.dry_run }}"
