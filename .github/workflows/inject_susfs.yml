name: Inject SusFS into Ocin4everKernel

on:
  workflow_dispatch:
    inputs:
      ksu_tag:
        description: "KernelSU-Next tag"
        default: "v3.1.0-legacy-susfs"
        required: false
      susfs_branch:
        description: "SusFS GitLab branch"
        default: "kernel-4.14"
        required: false
      dry_run:
        description: "Dry run (show changes, no push)"
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  KERNEL_REPO: "kingdom12-36/Ocin4everKernel"
  KERNEL_BRANCH: "Susfs"

jobs:
  inject:
    name: "Inject SusFS"
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout this repo (scripts)
        uses: actions/checkout@v4

      - name: Clone kernel repo
        run: |
          git config --global user.name  "SusFS Bot"
          git config --global user.email "susfs-bot@noreply"
          git clone \
            --recurse-submodules \
            --branch "${{ env.KERNEL_BRANCH }}" \
            "https://${{ secrets.GH_PAT }}@github.com/${{ env.KERNEL_REPO }}.git" \
            kernel

      - name: Clone SusFS from GitLab
        run: |
          git clone \
            --depth=1 \
            --branch "${{ github.event.inputs.susfs_branch }}" \
            "https://gitlab.com/simonpunk/susfs4ksu.git" \
            susfs4ksu

      - name: Run inject script
        env:
          KSU_TAG: ${{ github.event.inputs.ksu_tag }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          chmod +x inject_susfs.sh
          ./inject_susfs.sh \
            "$(pwd)/kernel" \
            "$(pwd)/susfs4ksu" \
            "${{ env.KERNEL_REPO }}" \
            "${{ env.KERNEL_BRANCH }}" \
            "${{ github.event.inputs.dry_run }}"
